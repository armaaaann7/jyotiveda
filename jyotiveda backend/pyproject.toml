[project]
name = "jyotiveda"
version = "1.0.0"
description = "Jyotiveda — transformer-scale renewable reliability operating system for Indian distribution grids"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "cvxpy>=1.5",
  "highspy>=1.7",
  "pandapower>=2.14",
  "pvlib>=0.11",
  "lightgbm>=4.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "aiokafka>=0.11",
  "aiomqtt>=2.3",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "cryptography>=42",
  "pyjwt[crypto]>=2.8",
  "anthropic>=0.40",
  "gymnasium>=0.29",
  "orjson>=3.10",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Foundation-model forecasting (Amazon Chronos-2) + graph AI + RL training. Heavy (PyTorch).
ml = [
  "torch>=2.4",
  "chronos-forecasting>=2.3",
  "torch-geometric>=2.6",
  "stable-baselines3>=2.4",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "mlflow>=2.16",
  "shap>=0.46",
]
edge = ["pymodbus>=3.7", "onnxruntime>=1.18"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
jyotiveda = "jyotiveda.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jyotiveda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
