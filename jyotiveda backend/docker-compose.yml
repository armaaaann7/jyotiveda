# Full Jyotiveda stack on one machine:  docker compose up -d   (API → http://localhost:8000/docs)
# Profiles:  --profile ai  (MLflow + MinIO)   --profile auth (Keycloak OIDC)   --profile edge (edge gateway sim)
name: jyotiveda

x-app: &app
  image: ${JYOTIVEDA_IMAGE:-jyotiveda:latest}
  build: { context: ., args: { EXTRAS: "${EXTRAS:-}" } }
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment: &env
    JYOTIVEDA_ENV: staging
    JYOTIVEDA_DATABASE_URL: postgresql+asyncpg://jyoti:${POSTGRES_PASSWORD:-jyoti-dev}@timescaledb:5432/jyotiveda
    JYOTIVEDA_EVENT_BUS: kafka
    JYOTIVEDA_KAFKA_BOOTSTRAP: redpanda:9092
    JYOTIVEDA_REDIS_URL: redis://redis:6379/0
    JYOTIVEDA_MQTT_HOST: emqx
    JYOTIVEDA_OTLP_ENDPOINT: http://otel-collector:4317
    JYOTIVEDA_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    JYOTIVEDA_AUTH_MODE: ${AUTH_MODE:-dev}
    JYOTIVEDA_CORS_ORIGINS: '["http://localhost:3000"]'
  depends_on:
    timescaledb: { condition: service_healthy }
    redpanda: { condition: service_healthy }
    redis: { condition: service_started }

services:
  # ---------------------------------------------------------------- application cells ----
  api:
    <<: *app
    environment: { <<: *env, JYOTIVEDA_ROLE: all, JYOTIVEDA_CELL_ID: cell-a, JYOTIVEDA_ENV: dev, JYOTIVEDA_CONTROL_LOOP_ENABLED: "true" }
    ports: ["8000:8000"]

  migrate:
    image: timescale/timescaledb-ha:pg16
    restart: "no"
    command: ["psql", "postgresql://jyoti:${POSTGRES_PASSWORD:-jyoti-dev}@timescaledb:5432/jyotiveda", "-f", "/migrations/001_timescale_postgis.sql"]
    volumes: [./migrations:/migrations:ro]
    depends_on: { api: { condition: service_healthy } }
    profiles: [ops]

  edge-dt104:
    <<: *app
    command: ["jyotiveda", "edge", "--transformer", "DT-104", "--broker", "emqx", "--pubkey", "/run/secrets/dispatch_pub", "--outbox", "/tmp/outbox.db"]
    secrets: [dispatch_pub]
    profiles: [edge]

  # ---------------------------------------------------------------- data plane -----------
  timescaledb:
    image: timescale/timescaledb-ha:pg16   # TimescaleDB + PostGIS + pgvector
    environment: { POSTGRES_USER: jyoti, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-jyoti-dev}", POSTGRES_DB: jyotiveda }
    volumes: [pgdata:/home/postgres/pgdata/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jyoti -d jyotiveda"], interval: 5s, retries: 20 }

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --smp, "1", --memory, 1G, --overprovisioned, --node-id, "0", --check=false,
              --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://redpanda:9092"]
    ports: ["9092:9092"]
    healthcheck: { test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"], interval: 5s, retries: 30 }

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment: { KAFKA_BROKERS: redpanda:9092 }
    ports: ["8080:8080"]
    depends_on: [redpanda]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]

  emqx:
    image: emqx/emqx:5.8
    ports: ["1883:1883", "18083:18083"]

  # ---------------------------------------------------------------- AI platform ----------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: jyoti, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-jyoti-dev-secret}" }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    profiles: [ai]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/
    environment: { MLFLOW_S3_ENDPOINT_URL: http://minio:9000, AWS_ACCESS_KEY_ID: jyoti, AWS_SECRET_ACCESS_KEY: "${MINIO_PASSWORD:-jyoti-dev-secret}" }
    ports: ["5000:5000"]
    profiles: [ai]

  # ---------------------------------------------------------------- identity -------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_PASSWORD:-admin}" }
    volumes: [./deploy/keycloak:/opt/keycloak/data/import:ro]
    ports: ["8081:8080"]
    profiles: [auth]

  # ---------------------------------------------------------------- observability --------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [./deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./deploy/observability/grafana:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]

  loki:
    image: grafana/loki:3.2.1
    ports: ["3100:3100"]

secrets:
  dispatch_pub: { file: ./secrets/dispatch_ed25519.pub }

volumes: { pgdata: {}, minio: {} }
